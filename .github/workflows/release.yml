name: Publish installer
on:
  push:
    branches: [main]
    paths:
      - 'installation/**/*.py'
      - 'installation/**/*.sh'
      - 'install.sh'
      - 'scripts/**'
      - 'deploy/**/*.yaml'
      - 'deploy/**/*.yml'
      - 'deploy/**/*.example'
      - 'deploy/**/Dockerfile'
      - 'deploy/**/*.erl'
      - 'shared-assets.json'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installer-release
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/checks.yml
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build immutable release assets
        env:
          RELEASE_VERSION: v1.0.${{ github.run_number }}
        run: |
          python3 -B installation/build.py --version "$RELEASE_VERSION" --source-sha "$GITHUB_SHA"
          cp install.sh installation/dist/install.sh
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: v1.0.${{ github.run_number }}
        run: bash scripts/publish-release.sh
